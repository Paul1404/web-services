name: Validate deployment sources
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell scripts and redirect behavior
        run: |
          bash -n railway-sm-redaxo/entrypoint.sh
          for file in railway-*/entrypoint.sh; do
            case "$file" in railway-sm-redaxo/entrypoint.sh) ;; *) sh -n "$file" ;; esac
          done
          node --test tests/*.test.mjs
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - railway-sm-redaxo
          - railway-sm-redaxo-origin
          - railway-svu-wordpress
          - railway-svu-origin
          - railway-wengertsberg-wordpress
          - railway-wengertsberg-origin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.directory }}
          load: true
          tags: local/web-service:test
          cache-from: type=gha,scope=${{ matrix.directory }}
          cache-to: type=gha,mode=max,scope=${{ matrix.directory }}
      - name: Verify protected origin
        if: endsWith(matrix.directory, '-origin')
        run: bash tests/origin-smoke.sh local/web-service:test

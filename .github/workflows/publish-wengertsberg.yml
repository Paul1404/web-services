name: Publish checked Wengertsberg release
on:
  workflow_run:
    workflows: [Validate deployment sources]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: publish-wengertsberg
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish tested immutable image archives and promote desired state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          PROMOTION_KEY: ${{ secrets.MX_GITOPS_DEPLOY_KEY }}
        run: bash scripts/publish-wengertsberg.sh
